<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Party Game Fun!</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Fredoka One', sans-serif;
      background: linear-gradient(to bottom, #FFF6B7, #FCE38A);
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #FFB6B9;
      padding: 2rem;
      text-align: center;
      color: #fff;
      font-size: 2rem;
      border-bottom: 8px dotted #FFDE7D;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .game-intro {
      background-color: #D0F4DE;
      border: 5px dashed #A9DEF9;
      padding: 2rem;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
    }

    .start-btn {
      margin-top: 1rem;
      padding: 1rem 2rem;
      font-size: 1.5rem;
      background-color: #FFDE7D;
      color: #333;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .start-btn:hover {
      transform: scale(1.1);
      background-color: #FCF69C;
    }

    footer {
      background-color: #A9DEF9;
      text-align: center;
      padding: 1rem;
      font-size: 1rem;
      color: #333;
      border-top: 5px solid #FFB6B9;
    }
  </style>
</head>
<body>
<header>
  <h1>🎉 Welcome to the Party Game! 🎈</h1>
</header>

<main>
  <section class="game-intro">
    <h2>Ready to Play?</h2>
    <p>Click below to start the fun and win cool surprises!</p>
    <button class="start-btn">Start Game</button>
  </section>
</main>

<footer>
  <p>© 2025 Happy Kids Party. Made with ❤️ and balloons.</p>
</footer>
</body>
</html>
